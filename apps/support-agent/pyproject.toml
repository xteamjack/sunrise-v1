[project]
name = "support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xteam jack", email = "xteam.jack@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "datasets>=5.0.1",
    "duckdb>=1.5.5",
    "faker>=40.39.0",
    "mimesis>=21.0.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[project.scripts]
sunrise = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/app",
    "src/domain",
    "src/data",
    "src/ingest",
    "src/index",
    "src/adapters",
    "src/rag",
    "src/prompts",
    "src/agents",
    "src/tools",
    "src/memory",
    "src/guardrails",
    "src/observability",
    "src/serving",
    "src/config",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
]
